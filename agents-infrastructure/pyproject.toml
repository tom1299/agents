[project]
name = "agents-infrastructure"
version = "0.1.0"
description = "Infrastructure for agents"

requires-python = ">=3.13"
dependencies = [
    "agents-common",
    "langchain[mcp]>=1.4.0",
    "kubernetes>=37.0.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
agents-common = { workspace = true }
